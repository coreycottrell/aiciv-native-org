# ─────────────────────────────────────────────────────────────────────────────
# ASSEMBLER CONTRACT (informational — implemented in Phase 3 org-assembler.js)
#
# Given (top_lead_id, intent):
#   1. Resolve top_lead_id → lead entry.
#   2. If manifest_path is null → FAIL LOUDLY (T3.3).
#   3. Incarnate top lead as workflow via incarnation_runner (Phase 1).
#   4. For each id in commands: incarnate as Tier-2 agent (own incarnation
#      per boss — boss-attributed canon, no shared instance).
#   5. If mandatory_auditor: fire an auditor agent with witness != top lead.
#   6. Collapse → return compressed synthesis to caller (firewall, SPEC §4).
#
# Cycle / orphan / missing-manifest checks: T3.3 covers all three.
# ─────────────────────────────────────────────────────────────────────────────

