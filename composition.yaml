# AiCIV-Native Org — Declarative Composition Registry (TEMPLATE)
#
# THIS IS A TEMPLATE. The single `example-lead` below is a placeholder so the
# Phase-3 assembler workflow has something real to point at out of the box.
# When you adopt this layer in your own civ:
#
#   1. Delete the example-lead block (or rename it).
#   2. Add one entry per real team-lead your civ runs — using the schema below.
#   3. Set `manifest_path` to the on-disk path of that lead's manifest in
#      YOUR repo (the assembler resolves it against your civ-repo root, not
#      the originating civ's root).
#
# The originating civ ran ~15 leads here (a COO + ~10 vertical VPs +
# composites like coding-pm / marketing-vp). That whole roster lived in
# THIS file in the upstream snapshot. It has been intentionally stripped —
# the org topology is YOUR org's topology, not the originating civ's.
#
# Purpose: the org REGISTRY (data, not code). A generic assembler workflow
# reads this file to incarnate ANY org shape from manifests on disk.
# See spec/SPEC-SHEET-v0.2.md §3 (composition) + §1 (topology) + §11 (build sequence).
#
# Schema per lead:
#   id:                 stable lead identifier (slug, kebab-case)
#   domain:             one-line scope of accountability
#   tier_default:       1 (VP / top-of-fork) or 2 (specialist incarnation).
#                       Tier is POSITIONAL (SPEC §1) — a Tier-1 default can serve
#                       as Tier-2 under another lead. The DEFAULT is just the
#                       most-common seat.
#   commands:           [lead ids] this lead is wired to fork as Tier-2 agents.
#                       Empty list = leaf specialist (no children).
#   mandatory_auditor:  bool. If true, the assembler MUST fire an auditor
#                       (witness != producing_lead) before this lead's collapse
#                       returns upward. See SPEC §5 + §7.
#   manifest_path:      adopter-civ-root-relative path to the on-disk manifest.
#                       Resolved against the adopter civ's repo root (NOT the
#                       originating civ's root). NULL = manifest gap (lead
#                       exists in registry but no manifest on disk yet —
#                       assembler must fail loudly per TEST GATE 3 T3.3).
#                       A runnable example manifest ships at
#                       `team-leads/example-lead/manifest.md` so the assembler
#                       has something real to point at on first clone.
#   posture:            free-text behavioral tilt (e.g. "adversarial",
#                       "synthesizer", "executor"). Memory-field, not a type.
#
# DO NOT EDIT casually — this is the org topology. Changes ship via the same
# provisional-skill-lifecycle as any other doctrine artifact.
#
# Companion: skills/workflow-js-mastery/SKILL.md (the craft) — this
# file is the DATA the skill's patterns operate over.

version: 0.1.0
authored: 2026-05-30
spec_ref: spec/SPEC-SHEET-v0.2.md
build_phase: 1  # PR-1 / Phase 1 per BUILD-PLAN.md

